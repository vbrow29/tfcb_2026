name: Build devcontainer image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile.fixes
      - .github/workflows/devcontainer-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tfcb_2026
  TAG: 1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The base image is ~12 GB; clear preinstalled toolchains to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.fixes
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
